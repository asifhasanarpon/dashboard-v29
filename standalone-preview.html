<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard V29 — Sales CRM Bangladesh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F6F5F2;
      color: #1A1A1A;
    }
  </style>
</head>
<body class="p-3 md:p-5">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_SAVED_ITEMS = [
      { id: 's1', type: 'Deals', variant: 'coral', amount: '৳56L', badge: 'Negotiation · 80%', title: 'bKash Enterprise — Q4 Contract', subtitle: 'Saved 2h ago · Nusrat Jahan', collection: 'Enterprise Q4' },
      { id: 's2', type: 'Docs', variant: 'dark', badge: 'PDF · 14 pages', title: 'Closing Playbook — Enterprise Bangladesh v3', subtitle: 'Updated yesterday · RevOps Dhaka', collection: 'Onboarding kit' },
      { id: 's3', type: 'Calls', variant: 'video', duration: '18:42', badge: 'Recording', title: 'Demo call — Chaldal Systems', subtitle: 'Key moment at 11:20 · Security review', collection: 'Enterprise Q4' },
      { id: 's4', type: 'Snippets', variant: 'light', badge: 'Script snippet', quote: '"We integrate natively with local payment gateways (bKash/Nagad) and Azure AD out of the box—no middleware required."', title: 'Objection — "Single vendor policy in BD"', subtitle: 'Used 19 times this month', collection: 'Onboarding kit' },
      { id: 's5', type: 'Docs', variant: 'light', badge: 'Battlecard', quote: 'Highlight 42% faster local deployment & 24/7 Dhaka-based support vs. offshore legacy tiers.', title: 'Competitor battle card — Enterprise Cloud', subtitle: 'Saved 3d ago · Product Marketing', collection: 'Proposal templates' },
      { id: 's6', type: 'Deals', variant: 'coral', amount: '৳33L', badge: 'Proposal · 65%', title: 'Pathao Logistics — 120 seats', subtitle: 'Decision expected Friday · Tanvir Ahmed', collection: 'Enterprise Q4' },
      { id: 's7', type: 'Calls', variant: 'audio', duration: '04:15', badge: 'Voice note', title: 'Discovery call — Tanvir Ahmed (+880 1712-345678)', subtitle: 'Budget confirmed for Q4 rollout in Dhaka', collection: 'Saved by team' },
      { id: 's8', type: 'Snippets', variant: 'audio', duration: '01:48', badge: 'Coaching clip', title: 'Call snippet — handling BDT pricing pushback', subtitle: 'Top performer highlight · Sadia Islam', collection: 'Saved by team' },
      { id: 's9', type: 'Deals', variant: 'dark', badge: 'Deck · 22 slides', title: 'Q3 Retrospective — Bangladesh Sales Ops', subtitle: 'Win rate up +6.4% QoQ', collection: 'Proposal templates' }
    ];

    const INITIAL_TASKS = [
      { id: 't1', title: 'Send revised MSA redlines to Chaldal legal team', deal: 'Chaldal Systems · ৳1.12 Cr', category: 'Overdue', priority: 'High', type: 'Deals', due: 'Yesterday', completed: false },
      { id: 't2', title: 'Follow up with Tanvir (+880 1712-345678) on security questionnaire', deal: 'Pathao Logistics · ৳33L', category: 'Overdue', priority: 'High', type: 'Follow-ups', due: 'Yesterday', completed: false },
      { id: 't3', title: 'Prepare custom ROI model for bKash CFO', deal: 'bKash Enterprise · ৳56L', category: 'Today', priority: 'High', type: 'Deals', due: 'Today, 2:00 PM', completed: false },
      { id: 't4', title: 'Share SSO implementation guide with Farhana (+880 1623-890123)', deal: 'Brain Station 23 · ৳48L', category: 'Today', priority: 'Medium', type: 'Follow-ups', due: 'Today, 4:30 PM', completed: false },
      { id: 't5', title: 'Update Q4 commit numbers in CRM pipeline', deal: 'Internal · Dhaka RevOps', category: 'Today', priority: 'Medium', type: 'Deals', due: 'Today, 5:00 PM', completed: false },
      { id: 't6', title: 'Confirm executive sponsor for Grameenphone pilot', deal: 'Grameenphone · ৳64L', category: 'Today', priority: 'High', type: 'Follow-ups', due: 'Today, 6:00 PM', completed: false },
      { id: 't7', title: 'Schedule technical deep-dive with solutions engineer', deal: 'Chaldal Systems · ৳1.12 Cr', category: 'Upcoming', priority: 'High', type: 'Deals', due: 'Tomorrow', completed: false },
      { id: 't8', title: 'Draft multi-year discount options for Walton', deal: 'Walton Hi-Tech · ৳78L', category: 'Upcoming', priority: 'Medium', type: 'Deals', due: 'Thu, Nov 20', completed: false },
      { id: 't11', title: 'Send SOC2 Type II report to bKash security', deal: 'bKash Enterprise · ৳56L', category: 'Completed', priority: 'Medium', type: 'Deals', due: 'Completed 9:15 AM', completed: true },
      { id: 't12', title: 'Log discovery call notes for Pathao Logistics', deal: 'Pathao Logistics · ৳33L', category: 'Completed', priority: 'Low', type: 'Deals', due: 'Completed Yesterday', completed: true }
    ];

    const INITIAL_THREADS = [
      {
        id: 'm1', name: 'Tanvir Ahmed', role: 'VP Operations', company: 'Pathao Logistics', phone: '+880 1712-345678', dealValue: '৳33 Lakh', stage: 'Proposal · 65%',
        avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=160&auto=format&fit=crop&q=80',
        unread: true, time: '2m', preview: 'Can we include the 20 extra viewer seats in the annual enterprise tier?',
        messages: [
          { id: 1, sender: 'them', time: '10:14 AM', text: 'Hey team — thanks for sending over the Pathao rollout proposal yesterday.' },
          { id: 2, sender: 'me', time: '10:18 AM', text: 'Happy to help, Tanvir bhai! We can structure a phased ramp or lock in the multi-year BDT rate right away.' },
          { id: 3, sender: 'them', time: '10:21 AM', text: 'Can we include the 20 extra viewer seats in the annual tier? If that works, we can get signature by Friday.' }
        ]
      },
      {
        id: 'm2', name: 'Nusrat Jahan', role: 'Head of Engineering', company: 'bKash Enterprise', phone: '+880 1819-456789', dealValue: '৳56 Lakh', stage: 'Negotiation · 80%',
        avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=160&auto=format&fit=crop&q=80',
        unread: true, time: '18m', preview: 'Security signed off on the SOC2 package. Ready for final legal review.',
        messages: [
          { id: 1, sender: 'them', time: '9:40 AM', text: 'Security signed off on the SOC2 package. Ready for final legal review.' }
        ]
      },
      {
        id: 'm3', name: 'Rafiqul Islam', role: 'CTO', company: 'Chaldal Systems', phone: '+880 1912-789012', dealValue: '৳1.12 Crore', stage: 'Negotiation · 90%',
        avatar: 'https://images.unsplash.com/photo-1628157582853-a796fa650a6a?w=160&auto=format&fit=crop&q=80',
        unread: true, time: '1h', preview: 'Let’s lock in Thursday 11 AM for the architecture walkthrough.',
        messages: [
          { id: 1, sender: 'them', time: '8:30 AM', text: 'Let’s lock in Thursday 11 AM for the architecture walkthrough at our Banani office.' }
        ]
      }
    ];

    function App() {
      const [activeNav, setActiveNav] = useState('home');
      const [period, setPeriod] = useState('Q4');
      const [selectedDay, setSelectedDay] = useState(14);
      const [savedItems] = useState(INITIAL_SAVED_ITEMS);
      const [savedTab, setSavedTab] = useState('All');
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [threads, setThreads] = useState(INITIAL_THREADS);
      const [activeThreadId, setActiveThreadId] = useState('m1');
      const [draftMessage, setDraftMessage] = useState('');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const overdueCount = tasks.filter(t => !t.completed && t.category === 'Overdue').length;
      const dueTodayCount = tasks.filter(t => !t.completed && t.category === 'Today').length;
      const upcomingCount = tasks.filter(t => !t.completed && t.category === 'Upcoming').length;
      const completedCount = tasks.filter(t => t.completed).length;

      const activeThread = threads.find(t => t.id === activeThreadId) || threads[0];

      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed, category: !t.completed ? 'Completed' : 'Today' } : t));
      };

      const sendMessage = (e) => {
        e.preventDefault();
        if (!draftMessage.trim()) return;
        setThreads(prev => prev.map(t => t.id === activeThreadId ? {
          ...t,
          messages: [...t.messages, { id: Date.now(), sender: 'me', time: 'Just now', text: draftMessage.trim() }]
        } : t));
        setDraftMessage('');
      };

      return (
        <div className="flex gap-5 min-h-[90vh]">
          {/* Sidebar */}
          <aside className="w-14 bg-[#18181B] text-white rounded-[28px] py-4 flex flex-col items-center justify-between shrink-0 shadow-xl">
            <div className="flex flex-col items-center gap-4">
              <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-[#FF6B57] to-[#FF856D] flex items-center justify-center">
                <div className="w-2.5 h-2.5 rounded-full bg-white" />
              </div>
              <div className="flex flex-col gap-2 mt-2">
                {[
                  { id: 'home', icon: 'home' },
                  { id: 'saved', icon: 'bookmark' },
                  { id: 'tasks', icon: 'check-square', badge: overdueCount },
                  { id: 'messages', icon: 'message-square' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveNav(item.id)}
                    className={`w-10 h-10 rounded-full flex items-center justify-center relative transition-all ${activeNav === item.id ? 'bg-[#FF6B57] text-white' : 'text-zinc-400 hover:text-white'}`}
                  >
                    <i data-lucide={item.icon} class="w-4 h-4"></i>
                    {item.badge > 0 && <span className="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#FF6B57] border-2 border-[#18181B] text-[9px] font-bold flex items-center justify-center text-white">{item.badge}</span>}
                  </button>
                ))}
              </div>
            </div>
            <div className="w-8 h-8 rounded-full overflow-hidden border border-white/20" title="Asif Hossain (Dhaka HQ)">
              <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&auto=format&fit=crop&q=80" alt="Asif Hossain" className="w-full h-full object-cover" />
            </div>
          </aside>

          <div className="flex-1 flex flex-col min-w-0">
            <header className="flex items-center justify-between mb-5">
              <div className="flex items-center gap-2 bg-white rounded-full p-1 shadow-sm">
                {['home', 'saved', 'tasks', 'messages'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setActiveNav(tab)}
                    className={`px-4 py-1.5 rounded-full text-xs font-medium capitalize ${
                      activeNav === tab ? 'bg-[#18181B] text-white' : 'text-zinc-600'
                    }`}
                  >
                    {tab}
                  </button>
                ))}
              </div>
              <div className="text-xs text-zinc-500 font-semibold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full border border-emerald-200">
                🇧🇩 Dhaka, Bangladesh · Q4 CRM
              </div>
            </header>

            {activeNav === 'home' && (
              <div className="grid grid-cols-12 gap-5">
                <div className="col-span-12 lg:col-span-8 flex flex-col gap-5">
                  <div className="bg-white rounded-[28px] p-6 shadow-sm">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[11px] uppercase tracking-wider text-zinc-400">Q4 Bangladesh Revenue Pulse</span>
                        <h1 className="text-2xl font-bold mt-0.5">Close the quarter stronger</h1>
                      </div>
                      <div className="bg-[#F6F5F2] rounded-full p-0.5 flex text-xs">
                        {['Q3', 'Q4', 'Year'].map(p => (
                          <button key={p} onClick={() => setPeriod(p)} className={`px-3 py-1 rounded-full ${period === p ? 'bg-[#18181B] text-white' : 'text-zinc-500'}`}>{p}</button>
                        ))}
                      </div>
                    </div>
                    <div className="mt-6 flex items-baseline gap-3">
                      <span className="text-4xl font-bold">{period === 'Q4' ? '৳55.5L' : period === 'Q3' ? '৳48.6L' : '৳1.84 Cr'}</span>
                      <span className="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full">+14.2% vs target</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-12 gap-5">
                    <div className="md:col-span-7 bg-white rounded-[28px] p-6 shadow-sm">
                      <div className="text-sm font-semibold">Pipeline by stage (BDT)</div>
                      <div className="text-3xl font-bold mt-1">৳53.6L</div>
                      <div className="grid grid-cols-5 gap-3 items-end h-40 mt-6">
                        {[
                          { s: 'Lead', v: '৳8.4L', h: '50%' },
                          { s: 'Qualified', v: '৳11.8L', h: '68%' },
                          { s: 'Proposal', v: '৳14.2L', h: '82%' },
                          { s: 'Negotiation', v: '৳11.2L', h: '95%', active: true },
                          { s: 'Closing', v: '৳8.0L', h: '60%' }
                        ].map(b => (
                          <div key={b.s} className="flex flex-col items-center h-full justify-end gap-1.5">
                            <span className="text-[10px] text-zinc-500 font-semibold">{b.v}</span>
                            <div style={{ height: b.h }} className={`w-full rounded-2xl ${b.active ? 'bg-gradient-to-t from-[#FF6B57] to-[#FF856D]' : 'bg-[#F6F5F2]'}`} />
                            <span className="text-[10px] text-zinc-400">{b.s}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="md:col-span-5 bg-gradient-to-br from-[#FF6B57] to-[#FF856D] text-white rounded-[28px] p-6 shadow-lg flex flex-col justify-between">
                      <div className="flex justify-between text-xs">
                        <span>Hot leads (BD)</span>
                        <span className="bg-white/20 px-2 py-0.5 rounded-full">90% commit</span>
                      </div>
                      <div className="my-5">
                        <div className="text-4xl font-bold">৳1.12 Cr</div>
                        <div className="text-sm font-semibold mt-1">Chaldal Systems — Enterprise</div>
                      </div>
                      <div className="text-xs border-t border-white/20 pt-3 flex justify-between">
                        <span>bKash Enterprise</span>
                        <span className="font-semibold">৳56L · 80%</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="col-span-12 lg:col-span-4 bg-white rounded-[28px] p-6 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-center">
                      <h2 className="font-bold">Today (Dhaka)</h2>
                      <span className="text-xs text-zinc-400">Nov {selectedDay}</span>
                    </div>
                    <div className="grid grid-cols-5 gap-2 my-4">
                      {[12, 13, 14, 15, 16].map(d => (
                        <button key={d} onClick={() => setSelectedDay(d)} className={`py-2 rounded-2xl text-xs font-bold ${selectedDay === d ? 'bg-[#FF6B57] text-white' : 'bg-[#F6F5F2]'}`}>{d}</button>
                      ))}
                    </div>
                    <div className="space-y-2.5">
                      <div className="p-3 rounded-2xl bg-[#FF6B57]/10 text-xs">
                        <div className="font-semibold text-[#FF6B57]">10:00 AM</div>
                        <div className="font-bold mt-0.5">Pathao Logistics — Proposal Sync</div>
                        <div className="text-[11px] text-zinc-500 mt-0.5">Tanvir Ahmed (+880 1712-345678)</div>
                      </div>
                      <div className="p-3 rounded-2xl bg-[#F6F5F2] text-xs">
                        <div className="font-semibold text-zinc-500">01:30 PM</div>
                        <div className="font-bold mt-0.5">Chaldal Systems — Legal Redlines</div>
                        <div className="text-[11px] text-zinc-500 mt-0.5">Rafiqul Islam (+880 1912-789012)</div>
                      </div>
                    </div>
                  </div>
                  <div className="mt-6 bg-[#18181B] text-white rounded-3xl p-5">
                    <div className="text-xs text-zinc-400">Deal Spotlight · ৳56L</div>
                    <div className="text-sm font-bold mt-1">bKash Enterprise — Q4 Contract</div>
                    <div className="text-[11px] text-zinc-400 mt-1">Nusrat Jahan (+880 1819-456789)</div>
                    <button onClick={() => setActiveNav('saved')} className="mt-3 w-full py-2 rounded-full bg-white/10 text-xs">Open deal room</button>
                  </div>
                </div>
              </div>
            )}

            {activeNav === 'saved' && (
              <div className="space-y-4">
                <h1 className="text-2xl font-bold">Saved Items (Bangladesh)</h1>
                <div className="flex gap-2">
                  {['All', 'Deals', 'Docs', 'Calls', 'Snippets'].map(t => (
                    <button key={t} onClick={() => setSavedTab(t)} className={`px-3.5 py-1.5 rounded-full text-xs font-medium ${savedTab === t ? 'bg-[#18181B] text-white' : 'bg-white'}`}>{t}</button>
                  ))}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {savedItems.filter(i => savedTab === 'All' || i.type === savedTab).map(item => (
                    <div key={item.id} className="bg-white rounded-[24px] p-4 shadow-sm">
                      <div className={`h-28 rounded-2xl p-4 flex flex-col justify-between ${item.variant === 'coral' ? 'bg-gradient-to-br from-[#FF6B57] to-[#FF856D] text-white' : item.variant === 'dark' || item.variant === 'video' ? 'bg-[#18181B] text-white' : 'bg-[#F6F5F2] text-zinc-800'}`}>
                        <span className="text-[10px] uppercase font-semibold opacity-80">{item.badge}</span>
                        <div className="text-2xl font-bold">{item.amount || item.duration || ''}</div>
                      </div>
                      <div className="pt-3">
                        <div className="text-xs font-bold">{item.title}</div>
                        <div className="text-[11px] text-zinc-400 mt-0.5">{item.subtitle}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeNav === 'tasks' && (
              <div className="space-y-4">
                <h1 className="text-2xl font-bold">Tasks</h1>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-gradient-to-br from-[#FF6B57] to-[#FF856D] text-white rounded-[24px] p-5">
                    <div className="text-xs">Overdue</div>
                    <div className="text-3xl font-bold mt-1">{overdueCount}</div>
                  </div>
                  <div className="bg-white rounded-[24px] p-5"><div className="text-xs text-zinc-400">Due today</div><div className="text-3xl font-bold mt-1">{dueTodayCount}</div></div>
                  <div className="bg-white rounded-[24px] p-5"><div className="text-xs text-zinc-400">Upcoming</div><div className="text-3xl font-bold mt-1">{upcomingCount}</div></div>
                  <div className="bg-white rounded-[24px] p-5"><div className="text-xs text-zinc-400">Completed</div><div className="text-3xl font-bold mt-1">{completedCount}</div></div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {tasks.map(t => (
                    <div key={t.id} onClick={() => toggleTask(t.id)} className="bg-white p-4 rounded-2xl flex items-center justify-between cursor-pointer shadow-sm">
                      <div>
                        <div className={`text-xs font-bold ${t.completed ? 'line-through text-zinc-400' : ''}`}>{t.title}</div>
                        <div className="text-[11px] text-zinc-400">{t.deal}</div>
                      </div>
                      <span className="text-[10px] px-2.5 py-1 rounded-full bg-[#F6F5F2]">{t.due}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeNav === 'messages' && (
              <div className="grid grid-cols-12 gap-4">
                <div className="col-span-12 md:col-span-4 bg-white rounded-[24px] p-4 space-y-2">
                  {threads.map(th => (
                    <div key={th.id} onClick={() => setActiveThreadId(th.id)} className={`p-3 rounded-2xl cursor-pointer flex items-center gap-3 ${activeThread.id === th.id ? 'bg-[#F6F5F2]' : ''}`}>
                      <img src={th.avatar} alt="" className="w-10 h-10 rounded-full object-cover shrink-0" />
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold">{th.name}</span>
                          <span className="text-[10px] text-emerald-600 font-semibold">{th.phone}</span>
                        </div>
                        <div className="text-[11px] text-[#FF6B57]">{th.company} · {th.dealValue}</div>
                        <div className="text-[11px] text-zinc-500 truncate">{th.preview}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="col-span-12 md:col-span-8 bg-white rounded-[24px] p-5 flex flex-col justify-between min-h-[420px]">
                  <div className="flex items-center justify-between pb-3 border-b border-zinc-100">
                    <div className="flex items-center gap-3">
                      <img src={activeThread.avatar} alt="" className="w-9 h-9 rounded-full object-cover" />
                      <div>
                        <div className="text-xs font-bold flex items-center gap-2">
                          <span>{activeThread.name}</span>
                          <span className="text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full font-semibold">{activeThread.phone}</span>
                        </div>
                        <div className="text-[11px] text-zinc-400">{activeThread.role} · {activeThread.company}</div>
                      </div>
                    </div>
                  </div>
                  <div className="space-y-3 my-4">
                    {activeThread.messages.map(m => (
                      <div key={m.id} className={`flex ${m.sender === 'me' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`px-4 py-2.5 rounded-2xl text-xs max-w-[75%] ${m.sender === 'me' ? 'bg-[#FF6B57] text-white' : 'bg-[#F6F5F2]'}`}>{m.text}</div>
                      </div>
                    ))}
                  </div>
                  <form onSubmit={sendMessage} className="flex gap-2 pt-4">
                    <input value={draftMessage} onChange={e => setDraftMessage(e.target.value)} placeholder="Type a reply..." className="flex-1 bg-[#F6F5F2] rounded-full px-4 py-2 text-xs focus:outline-none" />
                    <button type="submit" className="px-4 py-2 rounded-full bg-[#FF6B57] text-white text-xs font-semibold">Send</button>
                  </form>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
